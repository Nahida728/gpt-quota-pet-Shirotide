<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title description">
  <title id="title">Codex监测台 2.0 首页布局提案</title>
  <desc id="description">白色天青色的普通桌面窗口，左侧六页导航，右侧依次为额度、累计摘要、用量趋势、运行任务、模型费用和完成轮次。所有数值均为布局示例。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fcff"/>
      <stop offset=".52" stop-color="#e9f6fa"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#68c8dc"/>
      <stop offset="1" stop-color="#269fbf"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#b8e6ef"/>
      <stop offset="1" stop-color="#41acc9"/>
    </linearGradient>
    <filter id="ambient"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#45829a" flood-opacity=".07"/>
    </filter>
    <style>
