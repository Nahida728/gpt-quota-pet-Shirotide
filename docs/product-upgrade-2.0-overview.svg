      .muted { fill: #597584; }
      .tiny { font-size: 12px; }
      .small { font-size: 13px; }
      .body { font-size: 14px; }
      .label { font-size: 15px; font-weight: 600; }
      .heading { font-size: 17px; font-weight: 600; }
      .value { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .link { fill: #087e9e; }
      .panel { fill: #fff; fill-opacity: .79; stroke: #fff; stroke-opacity: .96; filter: url(#shadow); }
      .line { stroke: #dceaf0; stroke-width: 1; }
    </style>
    <clipPath id="window"><rect width="1360" height="900" rx="12"/></clipPath>
  </defs>
